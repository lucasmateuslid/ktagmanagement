name: CI-CD

on:
  push:
    branches: [main, master, develop]
  pull_request:
    branches: [main, master, develop]

jobs:
  frontend:
    name: Frontend Typecheck + Build
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install frontend dependencies
        run: npm --prefix frontend ci

      - name: Typecheck frontend
        run: npm --prefix frontend run lint

      - name: Build frontend
        run: npm --prefix frontend run build

  backend:
    name: Backend Typecheck + Build
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: backend/package-lock.json

      - name: Install backend dependencies
        run: npm --prefix backend ci

      - name: Typecheck backend
        run: npm --prefix backend run check

      - name: Build backend
        run: npm --prefix backend run build

  functions:
    name: Firebase Functions Sanity
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: backend/functions/package-lock.json

      - name: Install functions dependencies
        run: npm --prefix backend/functions ci

      - name: Validate functions entrypoint
        run: node -e "require('./backend/functions/index.js'); console.log('functions load ok')"

  deploy-placeholder:
    name: Deploy Placeholder
    runs-on: ubuntu-latest
    needs: [frontend, backend, functions]
    if: github.ref == 'refs/heads/main'
    steps:
      - name: Deployment strategy notice
        run: |
          echo "CI green. Configure OIDC + GCP deploy steps next:"
          echo "1) Deploy backend to Cloud Run"
          echo "2) Deploy frontend hosting"
          echo "3) Deploy Firebase Functions"
