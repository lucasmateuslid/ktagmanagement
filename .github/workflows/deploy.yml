name: Deploy

# Gatilhos:
#   - push em master  → auto-deploy: target=all, environment=production
#   - workflow_dispatch → escolha target/environment no UI (sandbox p/ smoke).
#
# Para deploy a sandbox, sempre usar dispatch — push em master sempre vai pra prod.
#
# Secrets esperados (configurar em Settings → Secrets and variables → Actions):
#   Sandbox (saastagmanager):
#     SAASTAGMANAGER_PROJECT_ID
#     SAASTAGMANAGER_WIF_PROVIDER
#     SAASTAGMANAGER_SERVICE_ACCOUNT
#     SAASTAGMANAGER_FIREBASE_API_KEY
#     SAASTAGMANAGER_FIREBASE_AUTH_DOMAIN
#     SAASTAGMANAGER_FIREBASE_PROJECT_ID
#     SAASTAGMANAGER_FIREBASE_STORAGE_BUCKET
#     SAASTAGMANAGER_FIREBASE_MESSAGING_SENDER_ID
#     SAASTAGMANAGER_FIREBASE_APP_ID
#
#   Produção (ktagfinder-prod):
#     KTAGFINDER_PROD_PROJECT_ID
#     KTAGFINDER_PROD_WIF_PROVIDER
#     KTAGFINDER_PROD_SERVICE_ACCOUNT
#     KTAGFINDER_PROD_FIREBASE_API_KEY
#     KTAGFINDER_PROD_FIREBASE_AUTH_DOMAIN
#     KTAGFINDER_PROD_FIREBASE_PROJECT_ID
#     KTAGFINDER_PROD_FIREBASE_STORAGE_BUCKET
#     KTAGFINDER_PROD_FIREBASE_MESSAGING_SENDER_ID
#     KTAGFINDER_PROD_FIREBASE_APP_ID
on:
  # Auto-deploy em push para master → production (target=all).
  # Para deployar sandbox ou qualquer subset, use o workflow_dispatch abaixo.
  push:
    branches: [master]
  workflow_dispatch:
    inputs:
      target:
        description: O que deployar
        type: choice
        required: true
        default: all
        options: [all, cloud-run, functions, firestore]
      environment:
        description: Ambiente alvo
        type: choice
        required: true
        default: sandbox
        options: [sandbox, production]

permissions:
  contents: read
  id-token: write   # obrigatório para Workload Identity Federation

env:
  REGION: us-central1
  SERVICE: ktag-app
  REPO: ktag
  # Defaults usados quando o gatilho é push (sem inputs). workflow_dispatch
  # sobrescreve via inputs.target / inputs.environment.
  TARGET: ${{ github.event.inputs.target || 'all' }}
  ENVIRONMENT: ${{ github.event.inputs.environment || 'production' }}

# Concorrência por (target, environment): sandbox e prod não bloqueiam um ao
# outro; reexecuções do mesmo par são serializadas.
concurrency:
  group: deploy-${{ github.event.inputs.target || 'all' }}-${{ github.event.inputs.environment || 'production' }}
  cancel-in-progress: false

jobs:
  # ── Gate: type-check obrigatório antes de qualquer deploy ─────────────────
  lint:
    name: Type-check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm
      - run: npm ci --no-audit --no-fund
      - name: tsc --noEmit
        run: npm run typecheck
      - name: ESLint (warn only)
        run: npm run lint || true

  # ── Pre-flight: valida que os secrets do ambiente existem ─────────────────
  # NÃO emite job outputs com valores de secret: o GitHub redacta (zera) qualquer
  # job output cujo valor case com um secret, então o downstream receberia "".
  # Cada deploy job seleciona sandbox/prod inline (ver step "Pick GCP env").
  resolve-env:
    name: Validate env secrets
    needs: lint
    runs-on: ubuntu-latest
    steps:
      - name: Validar secrets do ambiente
        env:
          ENVIRONMENT: ${{ github.event.inputs.environment || 'production' }}
          SBX_PROJECT_ID: ${{ secrets.SAASTAGMANAGER_PROJECT_ID }}
          SBX_WIF: ${{ secrets.SAASTAGMANAGER_WIF_PROVIDER }}
          SBX_SA: ${{ secrets.SAASTAGMANAGER_SERVICE_ACCOUNT }}
          PRD_PROJECT_ID: ${{ secrets.KTAGFINDER_PROD_PROJECT_ID }}
          PRD_WIF: ${{ secrets.KTAGFINDER_PROD_WIF_PROVIDER }}
          PRD_SA: ${{ secrets.KTAGFINDER_PROD_SERVICE_ACCOUNT }}
        run: |
          missing=()
          if [ "$ENVIRONMENT" = "production" ]; then
            [ -z "$PRD_PROJECT_ID" ] && missing+=("KTAGFINDER_PROD_PROJECT_ID")
            [ -z "$PRD_WIF" ]        && missing+=("KTAGFINDER_PROD_WIF_PROVIDER")
            [ -z "$PRD_SA" ]         && missing+=("KTAGFINDER_PROD_SERVICE_ACCOUNT")
          else
            [ -z "$SBX_PROJECT_ID" ] && missing+=("SAASTAGMANAGER_PROJECT_ID")
            [ -z "$SBX_WIF" ]        && missing+=("SAASTAGMANAGER_WIF_PROVIDER")
            [ -z "$SBX_SA" ]         && missing+=("SAASTAGMANAGER_SERVICE_ACCOUNT")
          fi
          if [ "${#missing[@]}" -gt 0 ]; then
            echo "::error::Secrets vazios para ENVIRONMENT=$ENVIRONMENT: ${missing[*]}"
            echo "::error::Cadastre em Settings → Secrets and variables → Actions como Repository secrets (não Environment secrets, este workflow não usa GitHub Environments)."
            exit 1
          fi
          echo "Secrets OK para ENVIRONMENT=$ENVIRONMENT"

  # ── Cloud Run: build → push → deploy ──────────────────────────────────────
  deploy-cloud-run:
    name: Cloud Run
    needs: resolve-env
    if: ${{ (github.event.inputs.target || 'all') == 'all' || github.event.inputs.target == 'cloud-run' }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Pick GCP env (inline; cross-job outputs com secret são redactados pelo GH)
        id: gcp
        env:
          ENVIRONMENT: ${{ github.event.inputs.environment || 'production' }}
          SBX_PROJECT_ID: ${{ secrets.SAASTAGMANAGER_PROJECT_ID }}
          SBX_WIF: ${{ secrets.SAASTAGMANAGER_WIF_PROVIDER }}
          SBX_SA: ${{ secrets.SAASTAGMANAGER_SERVICE_ACCOUNT }}
          PRD_PROJECT_ID: ${{ secrets.KTAGFINDER_PROD_PROJECT_ID }}
          PRD_WIF: ${{ secrets.KTAGFINDER_PROD_WIF_PROVIDER }}
          PRD_SA: ${{ secrets.KTAGFINDER_PROD_SERVICE_ACCOUNT }}
        run: |
          if [ "$ENVIRONMENT" = "production" ]; then
            PROJECT_ID="$PRD_PROJECT_ID"; WIF="$PRD_WIF"; SA="$PRD_SA"
          else
            PROJECT_ID="$SBX_PROJECT_ID"; WIF="$SBX_WIF"; SA="$SBX_SA"
          fi
          echo "::add-mask::$WIF"
          echo "::add-mask::$SA"
          echo "project_id=$PROJECT_ID" >> "$GITHUB_OUTPUT"
          echo "wif_provider=$WIF"     >> "$GITHUB_OUTPUT"
          echo "service_account=$SA"   >> "$GITHUB_OUTPUT"
          echo "PROJECT_ID=$PROJECT_ID" >> "$GITHUB_ENV"

      - id: auth
        uses: google-github-actions/auth@v2
        with:
          workload_identity_provider: ${{ steps.gcp.outputs.wif_provider }}
          service_account: ${{ steps.gcp.outputs.service_account }}

      - uses: google-github-actions/setup-gcloud@v2

      - name: Configurar Docker auth p/ Artifact Registry
        run: gcloud auth configure-docker ${REGION}-docker.pkg.dev --quiet

      - name: Pick VITE_FIREBASE_* by environment
        id: vite
        env:
          ENVIRONMENT: ${{ github.event.inputs.environment || 'production' }}
          SBX_API_KEY: ${{ secrets.SAASTAGMANAGER_FIREBASE_API_KEY }}
          SBX_AUTH_DOMAIN: ${{ secrets.SAASTAGMANAGER_FIREBASE_AUTH_DOMAIN }}
          SBX_PROJECT_ID: ${{ secrets.SAASTAGMANAGER_FIREBASE_PROJECT_ID }}
          SBX_BUCKET: ${{ secrets.SAASTAGMANAGER_FIREBASE_STORAGE_BUCKET }}
          SBX_SENDER: ${{ secrets.SAASTAGMANAGER_FIREBASE_MESSAGING_SENDER_ID }}
          SBX_APP_ID: ${{ secrets.SAASTAGMANAGER_FIREBASE_APP_ID }}
          PRD_API_KEY: ${{ secrets.KTAGFINDER_PROD_FIREBASE_API_KEY }}
          PRD_AUTH_DOMAIN: ${{ secrets.KTAGFINDER_PROD_FIREBASE_AUTH_DOMAIN }}
          PRD_PROJECT_ID: ${{ secrets.KTAGFINDER_PROD_FIREBASE_PROJECT_ID }}
          PRD_BUCKET: ${{ secrets.KTAGFINDER_PROD_FIREBASE_STORAGE_BUCKET }}
          PRD_SENDER: ${{ secrets.KTAGFINDER_PROD_FIREBASE_MESSAGING_SENDER_ID }}
          PRD_APP_ID: ${{ secrets.KTAGFINDER_PROD_FIREBASE_APP_ID }}
        run: |
          if [ "$ENVIRONMENT" = "production" ]; then
            echo "::add-mask::$PRD_API_KEY"
            echo "api_key=$PRD_API_KEY" >> "$GITHUB_OUTPUT"
            echo "auth_domain=$PRD_AUTH_DOMAIN" >> "$GITHUB_OUTPUT"
            echo "project_id=$PRD_PROJECT_ID" >> "$GITHUB_OUTPUT"
            echo "bucket=$PRD_BUCKET" >> "$GITHUB_OUTPUT"
            echo "sender=$PRD_SENDER" >> "$GITHUB_OUTPUT"
            echo "app_id=$PRD_APP_ID" >> "$GITHUB_OUTPUT"
          else
            echo "::add-mask::$SBX_API_KEY"
            echo "api_key=$SBX_API_KEY" >> "$GITHUB_OUTPUT"
            echo "auth_domain=$SBX_AUTH_DOMAIN" >> "$GITHUB_OUTPUT"
            echo "project_id=$SBX_PROJECT_ID" >> "$GITHUB_OUTPUT"
            echo "bucket=$SBX_BUCKET" >> "$GITHUB_OUTPUT"
            echo "sender=$SBX_SENDER" >> "$GITHUB_OUTPUT"
            echo "app_id=$SBX_APP_ID" >> "$GITHUB_OUTPUT"
          fi

      - name: Build & push image
        env:
          VITE_API_KEY: ${{ steps.vite.outputs.api_key }}
          VITE_AUTH_DOMAIN: ${{ steps.vite.outputs.auth_domain }}
          VITE_PROJECT_ID: ${{ steps.vite.outputs.project_id }}
          VITE_BUCKET: ${{ steps.vite.outputs.bucket }}
          VITE_SENDER: ${{ steps.vite.outputs.sender }}
          VITE_APP_ID: ${{ steps.vite.outputs.app_id }}
        run: |
          IMAGE_SHA=${REGION}-docker.pkg.dev/${PROJECT_ID}/${REPO}/${SERVICE}:${{ github.sha }}
          IMAGE_LATEST=${REGION}-docker.pkg.dev/${PROJECT_ID}/${REPO}/${SERVICE}:latest
          docker build \
            --build-arg VITE_FIREBASE_API_KEY="$VITE_API_KEY" \
            --build-arg VITE_FIREBASE_AUTH_DOMAIN="$VITE_AUTH_DOMAIN" \
            --build-arg VITE_FIREBASE_PROJECT_ID="$VITE_PROJECT_ID" \
            --build-arg VITE_FIREBASE_STORAGE_BUCKET="$VITE_BUCKET" \
            --build-arg VITE_FIREBASE_MESSAGING_SENDER_ID="$VITE_SENDER" \
            --build-arg VITE_FIREBASE_APP_ID="$VITE_APP_ID" \
            -t "$IMAGE_SHA" -t "$IMAGE_LATEST" .
          docker push "$IMAGE_SHA"
          docker push "$IMAGE_LATEST"
          echo "IMAGE=$IMAGE_SHA" >> "$GITHUB_ENV"

      - name: Deploy Cloud Run
        run: |
          gcloud run deploy "$SERVICE" \
            --image="$IMAGE" \
            --region="$REGION" \
            --project="$PROJECT_ID" \
            --platform=managed \
            --allow-unauthenticated \
            --port=8080 \
            --memory=512Mi \
            --cpu=1 \
            --min-instances=0 \
            --max-instances=10 \
            --set-env-vars=NODE_ENV=production \
            --quiet

      - name: Imprimir URL
        run: gcloud run services describe "$SERVICE" --region="$REGION" --project="$PROJECT_ID" --format='value(status.url)'

  # ── Firebase Functions ────────────────────────────────────────────────────
  deploy-functions:
    name: Firebase Functions
    needs: resolve-env
    if: ${{ (github.event.inputs.target || 'all') == 'all' || github.event.inputs.target == 'functions' }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Instalar deps de functions/
        working-directory: functions
        run: npm ci --no-audit --no-fund

      - name: Pick GCP env (inline; cross-job outputs com secret são redactados pelo GH)
        id: gcp
        env:
          ENVIRONMENT: ${{ github.event.inputs.environment || 'production' }}
          SBX_PROJECT_ID: ${{ secrets.SAASTAGMANAGER_PROJECT_ID }}
          SBX_WIF: ${{ secrets.SAASTAGMANAGER_WIF_PROVIDER }}
          SBX_SA: ${{ secrets.SAASTAGMANAGER_SERVICE_ACCOUNT }}
          PRD_PROJECT_ID: ${{ secrets.KTAGFINDER_PROD_PROJECT_ID }}
          PRD_WIF: ${{ secrets.KTAGFINDER_PROD_WIF_PROVIDER }}
          PRD_SA: ${{ secrets.KTAGFINDER_PROD_SERVICE_ACCOUNT }}
        run: |
          if [ "$ENVIRONMENT" = "production" ]; then
            PROJECT_ID="$PRD_PROJECT_ID"; WIF="$PRD_WIF"; SA="$PRD_SA"
          else
            PROJECT_ID="$SBX_PROJECT_ID"; WIF="$SBX_WIF"; SA="$SBX_SA"
          fi
          echo "::add-mask::$WIF"
          echo "::add-mask::$SA"
          echo "project_id=$PROJECT_ID" >> "$GITHUB_OUTPUT"
          echo "wif_provider=$WIF"     >> "$GITHUB_OUTPUT"
          echo "service_account=$SA"   >> "$GITHUB_OUTPUT"
          echo "PROJECT_ID=$PROJECT_ID" >> "$GITHUB_ENV"

      - id: auth
        uses: google-github-actions/auth@v2
        with:
          workload_identity_provider: ${{ steps.gcp.outputs.wif_provider }}
          service_account: ${{ steps.gcp.outputs.service_account }}
          create_credentials_file: true

      - uses: google-github-actions/setup-gcloud@v2

      - name: Instalar Firebase CLI
        run: npm install -g firebase-tools@13

      - name: firebase deploy --only functions
        env:
          GOOGLE_APPLICATION_CREDENTIALS: ${{ steps.auth.outputs.credentials_file_path }}
        run: firebase deploy --only functions --except functions:dailyBillingEnforcement,functions:scheduledTagUpdate,functions:cleanupOldHistory --project "$PROJECT_ID" --non-interactive --force

  # ── Firestore rules + indexes ─────────────────────────────────────────────
  deploy-firestore:
    name: Firestore rules + indexes
    needs: resolve-env
    if: ${{ (github.event.inputs.target || 'all') == 'all' || github.event.inputs.target == 'firestore' }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Pick GCP env (inline; cross-job outputs com secret são redactados pelo GH)
        id: gcp
        env:
          ENVIRONMENT: ${{ github.event.inputs.environment || 'production' }}
          SBX_PROJECT_ID: ${{ secrets.SAASTAGMANAGER_PROJECT_ID }}
          SBX_WIF: ${{ secrets.SAASTAGMANAGER_WIF_PROVIDER }}
          SBX_SA: ${{ secrets.SAASTAGMANAGER_SERVICE_ACCOUNT }}
          PRD_PROJECT_ID: ${{ secrets.KTAGFINDER_PROD_PROJECT_ID }}
          PRD_WIF: ${{ secrets.KTAGFINDER_PROD_WIF_PROVIDER }}
          PRD_SA: ${{ secrets.KTAGFINDER_PROD_SERVICE_ACCOUNT }}
        run: |
          if [ "$ENVIRONMENT" = "production" ]; then
            PROJECT_ID="$PRD_PROJECT_ID"; WIF="$PRD_WIF"; SA="$PRD_SA"
          else
            PROJECT_ID="$SBX_PROJECT_ID"; WIF="$SBX_WIF"; SA="$SBX_SA"
          fi
          echo "::add-mask::$WIF"
          echo "::add-mask::$SA"
          echo "project_id=$PROJECT_ID" >> "$GITHUB_OUTPUT"
          echo "wif_provider=$WIF"     >> "$GITHUB_OUTPUT"
          echo "service_account=$SA"   >> "$GITHUB_OUTPUT"
          echo "PROJECT_ID=$PROJECT_ID" >> "$GITHUB_ENV"

      - id: auth
        uses: google-github-actions/auth@v2
        with:
          workload_identity_provider: ${{ steps.gcp.outputs.wif_provider }}
          service_account: ${{ steps.gcp.outputs.service_account }}
          create_credentials_file: true

      - uses: google-github-actions/setup-gcloud@v2

      - name: Instalar Firebase CLI
        run: npm install -g firebase-tools@13

      - name: firebase deploy --only firestore
        env:
          GOOGLE_APPLICATION_CREDENTIALS: ${{ steps.auth.outputs.credentials_file_path }}
        run: firebase deploy --only firestore --project "$PROJECT_ID" --non-interactive
