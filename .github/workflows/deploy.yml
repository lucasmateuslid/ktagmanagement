name: Deploy

# Disparo manual: vá em Actions → "Deploy" → "Run workflow".
# Escolha o alvo no dropdown 'target' (all / cloud-run / functions / firestore).
on:
  workflow_dispatch:
    inputs:
      target:
        description: O que deployar
        type: choice
        required: true
        default: all
        options: [all, cloud-run, functions, firestore]

permissions:
  contents: read
  id-token: write   # obrigatório para Workload Identity Federation

env:
  PROJECT_ID: ${{ secrets.GCP_PROJECT_ID }}
  REGION: us-central1
  SERVICE: ktag-app
  REPO: ktag

# Garante que dois deploys simultâneos do mesmo alvo não conflitem.
concurrency:
  group: deploy-${{ github.event.inputs.target }}
  cancel-in-progress: false

jobs:
  # ── Gate: type-check obrigatório antes de qualquer deploy ─────────────────
  lint:
    name: Type-check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm
      - run: npm ci --no-audit --no-fund
      - name: tsc --noEmit
        run: npm run lint

  # ── Cloud Run: build → push → deploy ──────────────────────────────────────
  deploy-cloud-run:
    name: Cloud Run
    needs: lint
    if: ${{ github.event.inputs.target == 'all' || github.event.inputs.target == 'cloud-run' }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - id: auth
        uses: google-github-actions/auth@v2
        with:
          workload_identity_provider: ${{ secrets.GCP_WIF_PROVIDER }}
          service_account: ${{ secrets.GCP_SERVICE_ACCOUNT }}

      - uses: google-github-actions/setup-gcloud@v2

      - name: Configurar Docker auth p/ Artifact Registry
        run: gcloud auth configure-docker ${REGION}-docker.pkg.dev --quiet

      - name: Build & push image
        run: |
          IMAGE_SHA=${REGION}-docker.pkg.dev/${PROJECT_ID}/${REPO}/${SERVICE}:${{ github.sha }}
          IMAGE_LATEST=${REGION}-docker.pkg.dev/${PROJECT_ID}/${REPO}/${SERVICE}:latest
          docker build -t "$IMAGE_SHA" -t "$IMAGE_LATEST" .
          docker push "$IMAGE_SHA"
          docker push "$IMAGE_LATEST"
          echo "IMAGE=$IMAGE_SHA" >> "$GITHUB_ENV"

      - name: Deploy Cloud Run
        run: |
          gcloud run deploy "$SERVICE" \
            --image="$IMAGE" \
            --region="$REGION" \
            --platform=managed \
            --allow-unauthenticated \
            --port=8080 \
            --memory=512Mi \
            --cpu=1 \
            --min-instances=0 \
            --max-instances=10 \
            --set-env-vars=NODE_ENV=production \
            --quiet

      - name: Imprimir URL
        run: gcloud run services describe "$SERVICE" --region="$REGION" --format='value(status.url)'

  # ── Firebase Functions ────────────────────────────────────────────────────
  deploy-functions:
    name: Firebase Functions
    needs: lint
    if: ${{ github.event.inputs.target == 'all' || github.event.inputs.target == 'functions' }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Instalar deps de functions/
        working-directory: functions
        run: npm ci --no-audit --no-fund

      - id: auth
        uses: google-github-actions/auth@v2
        with:
          workload_identity_provider: ${{ secrets.GCP_WIF_PROVIDER }}
          service_account: ${{ secrets.GCP_SERVICE_ACCOUNT }}

      - uses: google-github-actions/setup-gcloud@v2

      - name: Instalar Firebase CLI
        run: npm install -g firebase-tools@13

      - name: firebase deploy --only functions
        run: firebase deploy --only functions --project "$PROJECT_ID" --non-interactive --force

  # ── Firestore rules + indexes ─────────────────────────────────────────────
  deploy-firestore:
    name: Firestore rules + indexes
    needs: lint
    if: ${{ github.event.inputs.target == 'all' || github.event.inputs.target == 'firestore' }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - id: auth
        uses: google-github-actions/auth@v2
        with:
          workload_identity_provider: ${{ secrets.GCP_WIF_PROVIDER }}
          service_account: ${{ secrets.GCP_SERVICE_ACCOUNT }}

      - uses: google-github-actions/setup-gcloud@v2

      - name: Instalar Firebase CLI
        run: npm install -g firebase-tools@13

      - name: firebase deploy --only firestore
        run: firebase deploy --only firestore --project "$PROJECT_ID" --non-interactive
