name: Deploy

# Gatilhos:
#   - somente workflow_dispatch → escolha explícita do componente e ambiente.
# Nenhum push faz deploy automático em produção.
#
# Secrets esperados (configurar em Settings → Secrets and variables → Actions):
#   Sandbox (saastagmanager): prefixo SAASTAGMANAGER_*
#   Produção (ktagfinder-prod):
#     KTAGFINDER_PROD_PROJECT_ID
#     KTAGFINDER_PROD_WIF_PROVIDER
#     KTAGFINDER_PROD_SERVICE_ACCOUNT
#     KTAGFINDER_PROD_FIREBASE_API_KEY
#     KTAGFINDER_PROD_FIREBASE_AUTH_DOMAIN
#     KTAGFINDER_PROD_FIREBASE_PROJECT_ID
#     KTAGFINDER_PROD_FIREBASE_STORAGE_BUCKET
#     KTAGFINDER_PROD_FIREBASE_MESSAGING_SENDER_ID
#     KTAGFINDER_PROD_FIREBASE_APP_ID
#   VPS (somente produção):
#     VPS_HOST, VPS_USER, VPS_SSH_PORT, VPS_APP_PATH
#     VPS_SSH_PRIVATE_KEY, VPS_SSH_KNOWN_HOSTS
on:
  workflow_dispatch:
    inputs:
      target:
        description: O que deployar
        type: choice
        required: true
        default: all
        options: [all, cloud-run, vps, functions, firestore]
      environment:
        description: Ambiente alvo
        type: choice
        required: true
        default: sandbox
        options: [sandbox, production]

permissions:
  contents: read
  id-token: write   # obrigatório para Workload Identity Federation
  packages: write   # publica a imagem usada pela VPS no GHCR

env:
  REGION: us-central1
  SERVICE: ktag-app
  REPO: ktag
  TARGET: ${{ inputs.target }}
  ENVIRONMENT: ${{ inputs.environment }}

concurrency:
  group: deploy-${{ inputs.environment }}
  cancel-in-progress: false

jobs:
  # ── Gate: type-check obrigatório antes de qualquer deploy ─────────────────
  lint:
    name: Type-check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: '22'
          cache: npm
      - run: npm ci --no-audit --no-fund
      - name: tsc --noEmit
        run: npm run typecheck
      - name: ESLint (warn only)
        run: npm run lint || true
      - name: Testes do backend
        run: npm test --workspace=@ktag/backend

  # ── Pre-flight: valida os secrets do ambiente escolhido ──────────────────
  # NÃO emite job outputs com valores de secret: o GitHub redacta (zera) qualquer
  # job output cujo valor case com um secret, então o downstream receberia "".
  resolve-env:
    name: Validate env secrets
    needs: lint
    runs-on: ubuntu-latest
    steps:
      - name: Validar secrets do ambiente
        env:
          ENVIRONMENT: ${{ inputs.environment }}
          SBX_PROJECT_ID: ${{ secrets.SAASTAGMANAGER_PROJECT_ID }}
          SBX_WIF: ${{ secrets.SAASTAGMANAGER_WIF_PROVIDER }}
          SBX_SA: ${{ secrets.SAASTAGMANAGER_SERVICE_ACCOUNT }}
          PRD_PROJECT_ID: ${{ secrets.KTAGFINDER_PROD_PROJECT_ID }}
          PRD_WIF: ${{ secrets.KTAGFINDER_PROD_WIF_PROVIDER }}
          PRD_SA: ${{ secrets.KTAGFINDER_PROD_SERVICE_ACCOUNT }}
          SBX_FIREBASE_API_KEY: ${{ secrets.SAASTAGMANAGER_FIREBASE_API_KEY }}
          SBX_FIREBASE_AUTH_DOMAIN: ${{ secrets.SAASTAGMANAGER_FIREBASE_AUTH_DOMAIN }}
          SBX_FIREBASE_PROJECT_ID: ${{ secrets.SAASTAGMANAGER_FIREBASE_PROJECT_ID }}
          SBX_FIREBASE_STORAGE_BUCKET: ${{ secrets.SAASTAGMANAGER_FIREBASE_STORAGE_BUCKET }}
          SBX_FIREBASE_MESSAGING_SENDER_ID: ${{ secrets.SAASTAGMANAGER_FIREBASE_MESSAGING_SENDER_ID }}
          SBX_FIREBASE_APP_ID: ${{ secrets.SAASTAGMANAGER_FIREBASE_APP_ID }}
          PRD_FIREBASE_API_KEY: ${{ secrets.KTAGFINDER_PROD_FIREBASE_API_KEY }}
          PRD_FIREBASE_AUTH_DOMAIN: ${{ secrets.KTAGFINDER_PROD_FIREBASE_AUTH_DOMAIN }}
          PRD_FIREBASE_PROJECT_ID: ${{ secrets.KTAGFINDER_PROD_FIREBASE_PROJECT_ID }}
          PRD_FIREBASE_STORAGE_BUCKET: ${{ secrets.KTAGFINDER_PROD_FIREBASE_STORAGE_BUCKET }}
          PRD_FIREBASE_MESSAGING_SENDER_ID: ${{ secrets.KTAGFINDER_PROD_FIREBASE_MESSAGING_SENDER_ID }}
          PRD_FIREBASE_APP_ID: ${{ secrets.KTAGFINDER_PROD_FIREBASE_APP_ID }}
          VPS_HOST: ${{ secrets.VPS_HOST }}
          VPS_USER: ${{ secrets.VPS_USER }}
          VPS_SSH_PORT: ${{ secrets.VPS_SSH_PORT }}
          VPS_APP_PATH: ${{ secrets.VPS_APP_PATH }}
          VPS_SSH_PRIVATE_KEY: ${{ secrets.VPS_SSH_PRIVATE_KEY }}
          VPS_SSH_KNOWN_HOSTS: ${{ secrets.VPS_SSH_KNOWN_HOSTS }}
          CLOUD_RUN_REALTIME: ${{ vars.KTAG_TRACCAR_REALTIME_ENABLED }}
        run: |
          missing=()
          if [ "$TARGET" = vps ] && [ "$ENVIRONMENT" != production ]; then
            echo "::error::O deploy da VPS existe somente no ambiente production."
            exit 1
          fi
          if [ "$TARGET" = all ] && [ "$ENVIRONMENT" = production ] && [ "$CLOUD_RUN_REALTIME" != false ]; then
            echo "::error::Defina a variável KTAG_TRACCAR_REALTIME_ENABLED=false para impedir dois workers realtime ativos."
            exit 1
          fi
          if [ "$ENVIRONMENT" = production ]; then
            if [ "$TARGET" != vps ]; then
              [ -z "$PRD_PROJECT_ID" ] && missing+=("KTAGFINDER_PROD_PROJECT_ID")
              [ -z "$PRD_WIF" ] && missing+=("KTAGFINDER_PROD_WIF_PROVIDER")
              [ -z "$PRD_SA" ] && missing+=("KTAGFINDER_PROD_SERVICE_ACCOUNT")
            fi
            if [ "$TARGET" = all ] || [ "$TARGET" = cloud-run ] || [ "$TARGET" = vps ]; then
              [ -z "$PRD_FIREBASE_API_KEY" ] && missing+=("KTAGFINDER_PROD_FIREBASE_API_KEY")
              [ -z "$PRD_FIREBASE_AUTH_DOMAIN" ] && missing+=("KTAGFINDER_PROD_FIREBASE_AUTH_DOMAIN")
              [ -z "$PRD_FIREBASE_PROJECT_ID" ] && missing+=("KTAGFINDER_PROD_FIREBASE_PROJECT_ID")
              [ -z "$PRD_FIREBASE_STORAGE_BUCKET" ] && missing+=("KTAGFINDER_PROD_FIREBASE_STORAGE_BUCKET")
              [ -z "$PRD_FIREBASE_MESSAGING_SENDER_ID" ] && missing+=("KTAGFINDER_PROD_FIREBASE_MESSAGING_SENDER_ID")
              [ -z "$PRD_FIREBASE_APP_ID" ] && missing+=("KTAGFINDER_PROD_FIREBASE_APP_ID")
            fi
            if [ "$TARGET" = all ] || [ "$TARGET" = vps ]; then
              [ -z "$VPS_HOST" ] && missing+=("VPS_HOST")
              [ -z "$VPS_USER" ] && missing+=("VPS_USER")
              [ -z "$VPS_SSH_PORT" ] && missing+=("VPS_SSH_PORT")
              [ -z "$VPS_APP_PATH" ] && missing+=("VPS_APP_PATH")
              [ -z "$VPS_SSH_PRIVATE_KEY" ] && missing+=("VPS_SSH_PRIVATE_KEY")
              [ -z "$VPS_SSH_KNOWN_HOSTS" ] && missing+=("VPS_SSH_KNOWN_HOSTS")
            fi
          else
            [ -z "$SBX_PROJECT_ID" ] && missing+=("SAASTAGMANAGER_PROJECT_ID")
            [ -z "$SBX_WIF" ] && missing+=("SAASTAGMANAGER_WIF_PROVIDER")
            [ -z "$SBX_SA" ] && missing+=("SAASTAGMANAGER_SERVICE_ACCOUNT")
            if [ "$TARGET" = all ] || [ "$TARGET" = cloud-run ]; then
              [ -z "$SBX_FIREBASE_API_KEY" ] && missing+=("SAASTAGMANAGER_FIREBASE_API_KEY")
              [ -z "$SBX_FIREBASE_AUTH_DOMAIN" ] && missing+=("SAASTAGMANAGER_FIREBASE_AUTH_DOMAIN")
              [ -z "$SBX_FIREBASE_PROJECT_ID" ] && missing+=("SAASTAGMANAGER_FIREBASE_PROJECT_ID")
              [ -z "$SBX_FIREBASE_STORAGE_BUCKET" ] && missing+=("SAASTAGMANAGER_FIREBASE_STORAGE_BUCKET")
              [ -z "$SBX_FIREBASE_MESSAGING_SENDER_ID" ] && missing+=("SAASTAGMANAGER_FIREBASE_MESSAGING_SENDER_ID")
              [ -z "$SBX_FIREBASE_APP_ID" ] && missing+=("SAASTAGMANAGER_FIREBASE_APP_ID")
            fi
          fi
          if [ "${#missing[@]}" -gt 0 ]; then
            echo "::error::Secrets vazios para $ENVIRONMENT: ${missing[*]}"
            echo "::error::Cadastre em Settings → Secrets and variables → Actions como Repository secrets (não Environment secrets, este workflow não usa GitHub Environments)."
            exit 1
          fi
          echo "Secrets OK para $ENVIRONMENT"

  # ── VPS: build → GHCR → deploy por SSH (somente produção) ────────────────
  deploy-vps:
    name: VPS
    needs: resolve-env
    if: ${{ inputs.environment == 'production' && (inputs.target == 'all' || inputs.target == 'vps') }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Definir imagem GHCR
        id: image
        run: echo "name=ghcr.io/${GITHUB_REPOSITORY_OWNER,,}/ktag-platform" >> "$GITHUB_OUTPUT"

      - name: Build e publicação da imagem VPS
        uses: docker/build-push-action@v6
        with:
          context: .
          file: Dockerfile
          push: true
          tags: |
            ${{ steps.image.outputs.name }}:${{ github.sha }}
            ${{ steps.image.outputs.name }}:latest
          build-args: |
            VITE_FIREBASE_API_KEY=${{ secrets.KTAGFINDER_PROD_FIREBASE_API_KEY }}
            VITE_FIREBASE_AUTH_DOMAIN=${{ secrets.KTAGFINDER_PROD_FIREBASE_AUTH_DOMAIN }}
            VITE_FIREBASE_PROJECT_ID=${{ secrets.KTAGFINDER_PROD_FIREBASE_PROJECT_ID }}
            VITE_FIREBASE_STORAGE_BUCKET=${{ secrets.KTAGFINDER_PROD_FIREBASE_STORAGE_BUCKET }}
            VITE_FIREBASE_MESSAGING_SENDER_ID=${{ secrets.KTAGFINDER_PROD_FIREBASE_MESSAGING_SENDER_ID }}
            VITE_FIREBASE_APP_ID=${{ secrets.KTAGFINDER_PROD_FIREBASE_APP_ID }}
            VITE_TRACKING_API_URL=${{ vars.KTAG_VPS_PUBLIC_URL || 'https://api-vps.ktagfinder.app' }}

      - name: Configurar SSH estrito
        env:
          SSH_KEY: ${{ secrets.VPS_SSH_PRIVATE_KEY }}
          KNOWN_HOSTS: ${{ secrets.VPS_SSH_KNOWN_HOSTS }}
        run: |
          install -m 700 -d ~/.ssh
          printf '%s\n' "$SSH_KEY" > ~/.ssh/id_ed25519
          printf '%s\n' "$KNOWN_HOSTS" > ~/.ssh/known_hosts
          chmod 600 ~/.ssh/id_ed25519 ~/.ssh/known_hosts

      - name: Implantar imagem imutável na VPS
        env:
          VPS_HOST: ${{ secrets.VPS_HOST }}
          VPS_USER: ${{ secrets.VPS_USER }}
          VPS_PORT: ${{ secrets.VPS_SSH_PORT }}
          VPS_APP_PATH: ${{ secrets.VPS_APP_PATH }}
          IMAGE: ${{ steps.image.outputs.name }}
        run: |
          scp -P "${VPS_PORT:-22}" \
            deploy/vps/docker-compose.yml \
            deploy/vps/deploy-image.sh \
            deploy/vps/rollback.sh \
            "$VPS_USER@$VPS_HOST:$VPS_APP_PATH/deploy/vps/"
          ssh -p "${VPS_PORT:-22}" "$VPS_USER@$VPS_HOST" \
            "cd '$VPS_APP_PATH' && chmod 750 deploy/vps/deploy-image.sh deploy/vps/rollback.sh && ./deploy/vps/deploy-image.sh '$IMAGE' '${{ github.sha }}'"

  # ── Cloud Run: build → push → deploy ──────────────────────────────────────
  deploy-cloud-run:
    name: Cloud Run
    needs: resolve-env
    if: ${{ vars.KTAG_DEPLOY_CLOUD_RUN != 'false' && (inputs.target == 'all' || inputs.target == 'cloud-run') }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - name: Selecionar projeto GCP
        id: gcp
        env:
          ENVIRONMENT: ${{ inputs.environment }}
          SBX_PROJECT_ID: ${{ secrets.SAASTAGMANAGER_PROJECT_ID }}
          SBX_WIF: ${{ secrets.SAASTAGMANAGER_WIF_PROVIDER }}
          SBX_SA: ${{ secrets.SAASTAGMANAGER_SERVICE_ACCOUNT }}
          PRD_PROJECT_ID: ${{ secrets.KTAGFINDER_PROD_PROJECT_ID }}
          PRD_WIF: ${{ secrets.KTAGFINDER_PROD_WIF_PROVIDER }}
          PRD_SA: ${{ secrets.KTAGFINDER_PROD_SERVICE_ACCOUNT }}
        run: |
          if [ "$ENVIRONMENT" = production ]; then
            PROJECT_ID="$PRD_PROJECT_ID"; WIF="$PRD_WIF"; SA="$PRD_SA"
          else
            PROJECT_ID="$SBX_PROJECT_ID"; WIF="$SBX_WIF"; SA="$SBX_SA"
          fi
          echo "::add-mask::$WIF"
          echo "::add-mask::$SA"
          echo "project_id=$PROJECT_ID" >> "$GITHUB_OUTPUT"
          echo "wif_provider=$WIF"     >> "$GITHUB_OUTPUT"
          echo "service_account=$SA"   >> "$GITHUB_OUTPUT"
          echo "PROJECT_ID=$PROJECT_ID" >> "$GITHUB_ENV"

      - id: auth
        uses: google-github-actions/auth@v3
        with:
          workload_identity_provider: ${{ steps.gcp.outputs.wif_provider }}
          service_account: ${{ steps.gcp.outputs.service_account }}

      - uses: google-github-actions/setup-gcloud@v3

      - name: Configurar Docker auth p/ Artifact Registry
        run: gcloud auth configure-docker ${REGION}-docker.pkg.dev --quiet

      - name: Selecionar Firebase web
        id: vite
        env:
          ENVIRONMENT: ${{ inputs.environment }}
          SBX_API_KEY: ${{ secrets.SAASTAGMANAGER_FIREBASE_API_KEY }}
          SBX_AUTH_DOMAIN: ${{ secrets.SAASTAGMANAGER_FIREBASE_AUTH_DOMAIN }}
          SBX_PROJECT_ID: ${{ secrets.SAASTAGMANAGER_FIREBASE_PROJECT_ID }}
          SBX_BUCKET: ${{ secrets.SAASTAGMANAGER_FIREBASE_STORAGE_BUCKET }}
          SBX_SENDER: ${{ secrets.SAASTAGMANAGER_FIREBASE_MESSAGING_SENDER_ID }}
          SBX_APP_ID: ${{ secrets.SAASTAGMANAGER_FIREBASE_APP_ID }}
          PRD_API_KEY: ${{ secrets.KTAGFINDER_PROD_FIREBASE_API_KEY }}
          PRD_AUTH_DOMAIN: ${{ secrets.KTAGFINDER_PROD_FIREBASE_AUTH_DOMAIN }}
          PRD_PROJECT_ID: ${{ secrets.KTAGFINDER_PROD_FIREBASE_PROJECT_ID }}
          PRD_BUCKET: ${{ secrets.KTAGFINDER_PROD_FIREBASE_STORAGE_BUCKET }}
          PRD_SENDER: ${{ secrets.KTAGFINDER_PROD_FIREBASE_MESSAGING_SENDER_ID }}
          PRD_APP_ID: ${{ secrets.KTAGFINDER_PROD_FIREBASE_APP_ID }}
          VPS_PUBLIC_URL: ${{ vars.KTAG_VPS_PUBLIC_URL || 'https://api-vps.ktagfinder.app' }}
        run: |
          if [ "$ENVIRONMENT" = production ]; then
            API_KEY="$PRD_API_KEY"; AUTH_DOMAIN="$PRD_AUTH_DOMAIN"
            FIREBASE_PROJECT_ID="$PRD_PROJECT_ID"; BUCKET="$PRD_BUCKET"
            SENDER="$PRD_SENDER"; APP_ID="$PRD_APP_ID"
            TRACKING_API_URL="$VPS_PUBLIC_URL"
          else
            API_KEY="$SBX_API_KEY"; AUTH_DOMAIN="$SBX_AUTH_DOMAIN"
            FIREBASE_PROJECT_ID="$SBX_PROJECT_ID"; BUCKET="$SBX_BUCKET"
            SENDER="$SBX_SENDER"; APP_ID="$SBX_APP_ID"
            TRACKING_API_URL=""
          fi
          echo "::add-mask::$API_KEY"
          echo "api_key=$API_KEY" >> "$GITHUB_OUTPUT"
          echo "auth_domain=$AUTH_DOMAIN" >> "$GITHUB_OUTPUT"
          echo "project_id=$FIREBASE_PROJECT_ID" >> "$GITHUB_OUTPUT"
          echo "bucket=$BUCKET" >> "$GITHUB_OUTPUT"
          echo "sender=$SENDER" >> "$GITHUB_OUTPUT"
          echo "app_id=$APP_ID" >> "$GITHUB_OUTPUT"
          echo "tracking_api_url=$TRACKING_API_URL" >> "$GITHUB_OUTPUT"

      - name: Build & push image
        env:
          VITE_API_KEY: ${{ steps.vite.outputs.api_key }}
          VITE_AUTH_DOMAIN: ${{ steps.vite.outputs.auth_domain }}
          VITE_PROJECT_ID: ${{ steps.vite.outputs.project_id }}
          VITE_BUCKET: ${{ steps.vite.outputs.bucket }}
          VITE_SENDER: ${{ steps.vite.outputs.sender }}
          VITE_APP_ID: ${{ steps.vite.outputs.app_id }}
          VITE_TRACKING_API_URL: ${{ steps.vite.outputs.tracking_api_url }}
        run: |
          IMAGE_SHA=${REGION}-docker.pkg.dev/${PROJECT_ID}/${REPO}/${SERVICE}:${{ github.sha }}
          IMAGE_LATEST=${REGION}-docker.pkg.dev/${PROJECT_ID}/${REPO}/${SERVICE}:latest
          docker build \
            --build-arg VITE_FIREBASE_API_KEY="$VITE_API_KEY" \
            --build-arg VITE_FIREBASE_AUTH_DOMAIN="$VITE_AUTH_DOMAIN" \
            --build-arg VITE_FIREBASE_PROJECT_ID="$VITE_PROJECT_ID" \
            --build-arg VITE_FIREBASE_STORAGE_BUCKET="$VITE_BUCKET" \
            --build-arg VITE_FIREBASE_MESSAGING_SENDER_ID="$VITE_SENDER" \
            --build-arg VITE_FIREBASE_APP_ID="$VITE_APP_ID" \
            --build-arg VITE_TRACKING_API_URL="$VITE_TRACKING_API_URL" \
            -t "$IMAGE_SHA" -t "$IMAGE_LATEST" .
          docker push "$IMAGE_SHA"
          docker push "$IMAGE_LATEST"
          echo "IMAGE=$IMAGE_SHA" >> "$GITHUB_ENV"

      - name: Deploy Cloud Run
        env:
          TRACCAR_REALTIME_ENABLED: ${{ vars.KTAG_TRACCAR_REALTIME_ENABLED || 'true' }}
        run: |
          gcloud run deploy "$SERVICE" \
            --image="$IMAGE" \
            --region="$REGION" \
            --project="$PROJECT_ID" \
            --platform=managed \
            --allow-unauthenticated \
            --port=8080 \
            --memory=512Mi \
            --cpu=1 \
            --min-instances=0 \
            --max-instances=10 \
            --set-env-vars=NODE_ENV=production,TRACCAR_REALTIME_ENABLED="$TRACCAR_REALTIME_ENABLED" \
            --quiet

      - name: Imprimir URL
        run: gcloud run services describe "$SERVICE" --region="$REGION" --project="$PROJECT_ID" --format='value(status.url)'

  # ── Firebase Functions ────────────────────────────────────────────────────
  deploy-functions:
    name: Firebase Functions
    needs: resolve-env
    if: ${{ inputs.target == 'all' || inputs.target == 'functions' }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v5
        with:
          node-version: '22'

      - name: Instalar deps de functions/
        working-directory: functions
        run: npm ci --no-audit --no-fund

      - name: Selecionar projeto GCP
        id: gcp
        env:
          ENVIRONMENT: ${{ inputs.environment }}
          SBX_PROJECT_ID: ${{ secrets.SAASTAGMANAGER_PROJECT_ID }}
          SBX_WIF: ${{ secrets.SAASTAGMANAGER_WIF_PROVIDER }}
          SBX_SA: ${{ secrets.SAASTAGMANAGER_SERVICE_ACCOUNT }}
          PRD_PROJECT_ID: ${{ secrets.KTAGFINDER_PROD_PROJECT_ID }}
          PRD_WIF: ${{ secrets.KTAGFINDER_PROD_WIF_PROVIDER }}
          PRD_SA: ${{ secrets.KTAGFINDER_PROD_SERVICE_ACCOUNT }}
        run: |
          if [ "$ENVIRONMENT" = production ]; then
            PROJECT_ID="$PRD_PROJECT_ID"; WIF="$PRD_WIF"; SA="$PRD_SA"
          else
            PROJECT_ID="$SBX_PROJECT_ID"; WIF="$SBX_WIF"; SA="$SBX_SA"
          fi
          echo "::add-mask::$WIF"
          echo "::add-mask::$SA"
          echo "project_id=$PROJECT_ID" >> "$GITHUB_OUTPUT"
          echo "wif_provider=$WIF"     >> "$GITHUB_OUTPUT"
          echo "service_account=$SA"   >> "$GITHUB_OUTPUT"
          echo "PROJECT_ID=$PROJECT_ID" >> "$GITHUB_ENV"

      - id: auth
        uses: google-github-actions/auth@v3
        with:
          workload_identity_provider: ${{ steps.gcp.outputs.wif_provider }}
          service_account: ${{ steps.gcp.outputs.service_account }}
          create_credentials_file: true

      - uses: google-github-actions/setup-gcloud@v3

      - name: Instalar Firebase CLI
        run: npm install -g firebase-tools@latest

      - name: Selecionar executor do histórico K-TAG
        working-directory: functions
        env:
          ENVIRONMENT: ${{ inputs.environment }}
        run: |
          if [ "$ENVIRONMENT" = production ]; then
            printf 'KTAG_HISTORY_EXECUTOR=vps\n' > ".env.$PROJECT_ID"
          else
            printf 'KTAG_HISTORY_EXECUTOR=functions\n' > ".env.$PROJECT_ID"
          fi

      - name: firebase deploy --only functions
        env:
          GOOGLE_APPLICATION_CREDENTIALS: ${{ steps.auth.outputs.credentials_file_path }}
        run: firebase deploy --only functions --project "$PROJECT_ID" --non-interactive --force

  # ── Firestore rules + indexes ─────────────────────────────────────────────
  deploy-firestore:
    name: Firestore rules + indexes
    needs: resolve-env
    if: ${{ inputs.target == 'all' || inputs.target == 'firestore' }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - name: Selecionar projeto GCP
        id: gcp
        env:
          ENVIRONMENT: ${{ inputs.environment }}
          SBX_PROJECT_ID: ${{ secrets.SAASTAGMANAGER_PROJECT_ID }}
          SBX_WIF: ${{ secrets.SAASTAGMANAGER_WIF_PROVIDER }}
          SBX_SA: ${{ secrets.SAASTAGMANAGER_SERVICE_ACCOUNT }}
          PRD_PROJECT_ID: ${{ secrets.KTAGFINDER_PROD_PROJECT_ID }}
          PRD_WIF: ${{ secrets.KTAGFINDER_PROD_WIF_PROVIDER }}
          PRD_SA: ${{ secrets.KTAGFINDER_PROD_SERVICE_ACCOUNT }}
        run: |
          if [ "$ENVIRONMENT" = production ]; then
            PROJECT_ID="$PRD_PROJECT_ID"; WIF="$PRD_WIF"; SA="$PRD_SA"
          else
            PROJECT_ID="$SBX_PROJECT_ID"; WIF="$SBX_WIF"; SA="$SBX_SA"
          fi
          echo "::add-mask::$WIF"
          echo "::add-mask::$SA"
          echo "project_id=$PROJECT_ID" >> "$GITHUB_OUTPUT"
          echo "wif_provider=$WIF"     >> "$GITHUB_OUTPUT"
          echo "service_account=$SA"   >> "$GITHUB_OUTPUT"
          echo "PROJECT_ID=$PROJECT_ID" >> "$GITHUB_ENV"

      - id: auth
        uses: google-github-actions/auth@v3
        with:
          workload_identity_provider: ${{ steps.gcp.outputs.wif_provider }}
          service_account: ${{ steps.gcp.outputs.service_account }}
          create_credentials_file: true

      - uses: google-github-actions/setup-gcloud@v3

      - name: Instalar Firebase CLI
        run: npm install -g firebase-tools@latest

      - name: firebase deploy --only firestore
        env:
          GOOGLE_APPLICATION_CREDENTIALS: ${{ steps.auth.outputs.credentials_file_path }}
        run: firebase deploy --only firestore --project "$PROJECT_ID" --non-interactive
