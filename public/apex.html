<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <meta name="robots" content="noindex" />
  <title>K-Tag Finder — Em construção</title>
  <link rel="icon" type="image/svg+xml" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'%3E%3Crect width='100' height='100' rx='20' fill='%23f59e0b' fill-opacity='0.1' stroke='%23f59e0b' stroke-width='3'/%3E%3Ctext x='50' y='68' font-family='system-ui' font-size='60' font-weight='900' text-anchor='middle' fill='%23f59e0b'%3EK%3C/text%3E%3C/svg%3E" />
  <style>
    :root {
      color-scheme: dark;
      font-family: system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
    }
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      min-height: 100vh;
      background: #09090b;
      color: #fff;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 1.5rem;
    }
    .wrap {
      max-width: 28rem;
      text-align: center;
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 2rem;
    }
    .logo {
      width: 6rem;
      height: 6rem;
      border-radius: 1rem;
      background: rgba(245, 158, 11, 0.1);
      border: 1px solid rgba(245, 158, 11, 0.3);
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 1.875rem;
      font-weight: 900;
      color: #f59e0b;
      letter-spacing: -0.05em;
    }
    h1 {
      font-size: 1.875rem;
      font-weight: 900;
      text-transform: uppercase;
      letter-spacing: 0.2em;
    }
    @media (min-width: 768px) { h1 { font-size: 2.25rem; } }
    p { color: #a1a1aa; font-size: 0.875rem; line-height: 1.5; }
    .status {
      color: #71717a;
      font-size: 0.75rem;
      text-transform: uppercase;
      letter-spacing: 0.3em;
      padding-top: 0.5rem;
    }
    a {
      color: #f59e0b;
      text-decoration: none;
      font-size: 0.875rem;
      border-bottom: 1px solid rgba(245, 158, 11, 0.3);
      padding-bottom: 2px;
    }
    a:hover { color: #fbbf24; border-color: rgba(251, 191, 36, 0.6); }
  </style>
</head>
<body>
  <main class="wrap">
    <div class="logo">K</div>
    <div>
      <h1>K-Tag Finder</h1>
      <p style="margin-top: 0.75rem">Plataforma de gestão e rastreamento de ativos veiculares.</p>
      <p class="status">Em construção</p>
    </div>
    <a href="mailto:contato@ktagfinder.app">contato@ktagfinder.app</a>
  </main>
</body>
</html>
